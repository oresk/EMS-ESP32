; glider-ems v1 - board specific build configuration
;
; Hardware: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM), no Ethernet PHY,
; no USB-UART bridge (console on the native USB-Serial-JTAG), DCDC on +3V3.
;
; The board is an EMS bus gateway built around a comparator front end:
;
;   bus ----+---- R/C filter ----+--> LM393 IN   OUT2 --R20 4k7--> GPIO18   (RX)
;           |                   |                              (R19 4k7 pull-up)
;           +--- Q1 (MMBT3904) <-+-- LM393 OUT1 --< IN1- <-------- GPIO17   (TX)
;                                                              (C11 1.5n filter)
;
; so RX is the comparator output and TX drives a comparator input that in turn
; switches Q1 and pulls the bus low. Two inversions live in that chain - verify the
; idle polarity on real hardware before trusting the bus timing.
;
; The stock s3_16M_P board definition already matches this module (flash 16 MB,
; memory_type qio_opi = octal PSRAM, ARDUINO_USB_MODE/CDC_ON_BOOT), so no custom
; board JSON is needed - only the six GPIO defaults differ from a BBQKees board.

[platformio]
; build this board with a plain `pio run`
default_envs = glider_ems

[env:glider_ems]
extends = env:s3_16M_P

build_flags =
  ${env:s3_16M_P.build_flags}
  ; EMS bus: comparator output (RX) and comparator input (TX)
  -DEMSESP_DEFAULT_RX_GPIO=18
  -DEMSESP_DEFAULT_TX_GPIO=17
  ; 1-Wire port J2: external 4k7 pull-up + 360R series, parasite power not possible.
  ; The upstream default is 18, which is our RX pin, so all three must move together.
  -DEMSESP_DEFAULT_DALLAS_GPIO=16
  ; status LED D11 via R22 470R. D10 (IO5) is spare, D12 is hardwired to +3V3.
  -DEMSESP_DEFAULT_LED_GPIO=4
  ; front panel button SW1 = BOOT on IO0 (same pin as the upstream default)
  -DEMSESP_DEFAULT_PBUTTON_GPIO=0
  ; no Ethernet PHY fitted
  -DEMSESP_DEFAULT_PHY_TYPE=0
